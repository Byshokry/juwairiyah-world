
name: Build Juwairiyah World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o JuwairiyahWorld_Full_Source.zip -d .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=juwairiyah_world .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: JuwairiyahWorld-APK
          path: build/app/outputs/flutter-apk/app-release.apk
